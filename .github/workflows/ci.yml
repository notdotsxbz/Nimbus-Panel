name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared (required before api/web typecheck, build and tests)
        run: npm run build --workspace @nimbus/shared

      - name: Installer script syntax check (bash -n)
        run: bash installer/tests/syntax-check.sh

      - name: Installer compatibility tests (mocked, real bash)
        run: bash installer/tests/mongo-compat.sh

      - name: Installer bootstrap tests (mock HTTP server, real bash)
        run: bash installer/tests/bootstrap.sh

      - name: Installer APT repository repair tests (fixtures, real bash)
        run: bash installer/tests/apt-repos.sh

      - name: Verify installer helper files are tracked in Git
        run: |
          for f in installer/install.sh installer/lib/mongo-compat.sh installer/lib/bootstrap.sh installer/lib/apt-repos.sh; do
            git ls-files --error-unmatch "$f" || { echo "MISSING FROM GIT: $f"; exit 1; }
            [ -s "$f" ] || { echo "EMPTY: $f"; exit 1; }
            echo "tracked and non-empty: $f"
          done

      - name: Shared package tests (imports compiled dist)
        run: npm run test --workspace @nimbus/shared

      - name: Build web
        run: npm run build --workspace @nimbus/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build api
        run: npm run build --workspace @nimbus/api

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/node-agent/go.mod
      - name: Vet node agent
        run: go vet ./...
        working-directory: apps/node-agent
      - name: Build node agent (linux amd64 + arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/nimbus-agent-amd64 .
          GOOS=linux GOARCH=arm64 go build -o /tmp/nimbus-agent-arm64 .
        working-directory: apps/node-agent

  integration:
    runs-on: ubuntu-latest
    needs: build
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nimbus-ci
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789
      AGENT_SHARED_SECRET: ci-only-agent-secret
      API_PORT: 4100
      SMOKE_BASE_URL: http://127.0.0.1:4100/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build shared + api
        run: |
          npm run build --workspace @nimbus/shared
          npm run build --workspace @nimbus/api
      - name: Boot API and run smoke tests
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:4100/api/v1/auth/me >/dev/null 2>&1 && break || sleep 1
          done
          node tests/api-smoke.mjs
          AGENT_SHARED_SECRET=ci-only-agent-secret node tests/agent-enrollment-smoke.mjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm audit (must be clean)
        run: npm audit --audit-level=low
      - name: Secret scan
        run: |
          ! grep -rInE "(sk_live|AKIA[0-9A-Z]{16}|-----BEGIN (RSA )?PRIVATE KEY-----)" \
            --include="*.ts" --include="*.tsx" --include="*.go" --include="*.sh" \
            apps packages services installer docs tests
